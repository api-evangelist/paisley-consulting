name: Paisley Consulting
description: >-
  Paisley Consulting was a governance, risk, and compliance (GRC) software
  company best known for its AutoAudit internal audit management product. The
  Paisley Consulting brand and its paisleyconsulting.com domain now redirect to
  Empowered Systems, a GRC software vendor whose Connected Risk platform delivers
  internal audit, internal controls, enterprise risk, operational risk,
  third-party risk, model risk, and policy & compliance management, along with
  the AutoAudit audit solution. The company supports frameworks including
  SOX/ICFR, COSO, Basel III, NIST, ISO 27001, and DORA. Surfaced as a portfolio
  company of Insight Partners and added to the API Evangelist network for
  enrichment; no public API, SDK, or developer surface is currently published.
